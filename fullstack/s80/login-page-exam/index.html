<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmashSupply Queue | Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="auth-shell">
      <!-- Left side: background image panel -->
      <section class="auth-visual" aria-label="Background">
        <div class="visual-overlay"></div>

        <div class="visual-topbar">
          <a class="mini-brand" href="#" aria-label="SmashSupply Queue Home">
            <span class="mini-badge">SS</span>
            <span class="mini-text">SmashSupply Queue</span>
          </a>

          <a class="mini-link" href="#" aria-label="Help">
            Help
            <i class="bi bi-question-circle"></i>
          </a>
        </div>

        <div class="visual-footer">
          <div class="visual-chips">
            <span class="chip"><i class="bi bi-shield-check"></i> Secure access</span>
            <span class="chip"><i class="bi bi-phone"></i> Mobile friendly</span>
            <span class="chip"><i class="bi bi-shuffle"></i> Fair rotations</span>
          </div>
        </div>
      </section>

      <!-- Right side: login form panel -->
      <section class="auth-form" aria-label="Login form">
        <div class="form-wrap">
          <div class="form-header text-center">
            <!-- Replace this image URL with your logo -->
            <img
              class="brand-logo"
              src="https://dummyimage.com/220x60/0b0f1a/ffffff&text=SmashSupply"
              alt="SmashSupply"
            />
            <p class="muted mt-3 mb-0">
              Sign in to access your membership queue and manage rotations.
            </p>
          </div>

          <div class="card auth-card border-0 shadow-lg mt-4">
            <div class="card-body p-4 p-md-5">
              <h1 class="h4 fw-bold mb-3">Sign in</h1>

              <form>
                <div class="mb-3">
                  <label for="email" class="form-label">Username or Email</label>
                  <div class="input-wrap">
                    <i class="bi bi-person"></i>
                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="email"
                      placeholder="Enter username or email"
                      autocomplete="username"
                      required
                    />
                  </div>
                </div>

                <div class="mb-2">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-wrap">
                    <i class="bi bi-key"></i>
                    <input
                      type="password"
                      class="form-control form-control-lg"
                      id="password"
                      placeholder="Enter password"
                      autocomplete="current-password"
                      required
                    />
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" />
                    <label class="form-check-label" for="remember">Stay signed in</label>
                  </div>

                  <a class="soft-link" href="#">Can’t sign in?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                  Sign in
                </button>

                <div class="divider my-4">
                  <span>OR</span>
                </div>

                <div class="row g-2">
                  <div class="col-12 col-md-4">
                    <button type="button" class="btn btn-provider w-100" aria-label="Continue with Google">
                      <i class="bi bi-google"></i>
                    </button>
                  </div>
                  <div class="col-12 col-md-4">
                    <button type="button" class="btn btn-provider w-100" aria-label="Continue with Apple">
                      <i class="bi bi-apple"></i>
                    </button>
                  </div>
                  <div class="col-12 col-md-4">
                    <button type="button" class="btn btn-provider w-100" aria-label="Continue with Discord">
                      <i class="bi bi-discord"></i>
                    </button>
                  </div>
                </div>            
              </form>
            </div>
          </div>

          <div class="form-footer mt-4">
            <div class="d-flex flex-wrap justify-content-between gap-2">
              <span class="muted small">© 2026 SmashSupply Queue</span>
              <div class="d-flex gap-3">
                <a class="soft-link small" href="#">Privacy</a>
                <a class="soft-link small" href="#">Terms</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
